kind = "web"
previewPath = "/"
title = "POS Rental Mobil"
version = "1.0.0"
id = "artifacts/pos-rental"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18749

[services.development]
run = "pnpm --filter @workspace/pos-rental run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pos-rental", "run", "build" ]
publicDir = "artifacts/pos-rental/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18749"
BASE_PATH = "/"
